:14px}.empty p{font-size:12px;color:#aaa;margin:12px 0 24px}.toast{position:fixed;top:24px;left:calc(50% + 110px);transform:translateX(-50%);z-index:40;background:#333;color:white;border:1px solid #555;padding:13px 20px;font-size:13px;border-radius:9px;box-shadow:0 5px 20px #0002;max-width:90vw;text-align:center}dialog{border:1px solid #bbb;border-radius:14px;background:#f3f3f3;padding:0;width:min(850px,94vw);max-height:94dvh;overflow:auto;color:#333}dialog::backdrop{background:#0009}.preview-header,.preview-footer{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;gap:12px;font-size:12px}.preview-header{border-bottom:1px solid #ddd}.close{font-size:23px;padding:2px 8px}.preview-main{display:flex;align-items:center;gap:12px;padding:18px}.preview-main img{min-width:0;max-width:calc(100% - 90px);max-height:65dvh;object-fit:contain;flex:1;background:white;border:1px solid #ddd}.switch{font-size:24px;border:1px solid #ccc;background:white;border-radius:50%;width:33px;height:33px;flex-shrink:0}.preview-footer{border-top:1px solid #ddd;color:#888}body:has(dialog[open]){overflow:hidden}[hidden]{display:none!important}@media(min-width:1400px){.view{padding-top:20px}.hero{padding-top:80px}}@media(max-width:800px){aside{width:180px;padding:26px 12px}.brand{font-size:16px;padding-left:8px}.nav{padding:12px 10px}main{margin-left:180px}.topbar{padding:0 25px}.view{padding:0 25px 40px}.hero{padding-top:45px}h1{font-size:29px}.inspiration-grid{grid-template-columns:repeat(2,1fr)}.params{flex-wrap:wrap;gap:10px}.params .primary{margin-top:5px}.chat-view{padding:25px 25px 210px}.chat-dock{left:180px;padding:20px 25px}.toast{left:calc(50% + 90px)}}@media(max-width:600px){aside{position:sticky;top:0;width:100%;height:62px;flex-direction:row;align-items:center;gap:6px;padding:8px 14px;border-right:0;border-bottom:1px solid #ddd}.brand{font-size:14px;padding:0;margin-right:auto;gap:7px}.brandmark{width:25px;height:25px}.nav{width:auto;gap:5px;font-size:11px;padding:9px 10px;margin:0}.nav svg{display:none}.sidebar-note{display:none}main{margin:0}.topbar{height:48px;padding:0 20px}.topbar strong,.badge{font-size:10px}.view{padding:0 18px 35px}.hero{padding:36px 0 25px}h1{font-size:27px}.subtitle{font-size:12px}.composer{padding:18px}.composer textarea{font-size:14px;min-height:120px}.params{gap:10px}.param{flex:1;min-width:75px}.param select{width:100%;padding-right:12px;font-size:11px}.params .primary{width:100%;margin:8px 0 0}.inspiration{margin-top:35px}.inspiration-grid{gap:12px}.inspo-bottom{padding:12px;font-size:11px}.inspo-bottom span{display:none}.section-head span{font-size:10px}.chat-view{padding:22px 18px 190px}.chat-dock{left:0;padding:22px 14px 14px}.chat-title h1{font-size:19px}.bubble{max-width:95%;font-size:13px;padding:15px}.wall{gap:12px}.card-meta{padding:10px 8px;font-size:10px}.download{font-size:10px;padding:6px}.toast{left:50%;top:76px}.preview-main{padding:12px;gap:5px}.preview-main img{max-width:calc(100% - 70px)}.switch{width:30px;height:30px}.preview-header,.preview-footer{padding:12px 15px}.prototype-tools{align-items:flex-start}.history-heading{padding-top:30px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<aside aria-label="主导航"><div class="brand"><span class="brandmark" aria-hidden="true">形</span>形意 Logo</div><button class="nav active" id="nav-home" onclick="navigate('home')"><span aria-hidden="true">＋</span>开始创作</button><button class="nav" id="nav-history" onclick="navigate('history')"><span aria-hidden="true">◷</span>历史记录</button><div class="sidebar-note"><span>交互原型 / V1</span><br>灰阶线框 · 模拟生成</div></aside>
<main><header class="topbar"><strong id="page-label">开始创作</strong><span class="badge">LOGO DESIGN STUDIO</span></header>
<section id="home" class="view" aria-labelledby="home-title"><div class="hero"><p class="eyebrow">A SMALL IDEA. A DISTINCT MARK.</p><h1 id="home-title">从一个想法，到一个标志。</h1><p class="subtitle">说说你的品牌，让灵感有一个形状。</p></div>
<form id="home-form" class="composer"><label class="prompt-label" for="brief">你的品牌想法</label><textarea id="brief" maxlength="1000" placeholder="例如：为咖啡品牌「山间」设计 Logo，简约、自然，有山与咖啡的元素。" aria-describedby="brief-error"></textarea><div class="params"><label class="param">Logo 风格<select id="style"><option>极简几何</option><option>字母组合</option><option>复古徽章</option><option>自然有机</option><option>现代字标</option><option>趣味图形</option></select></label><label class="param">图片比例<select id="ratio"><option>1:1</option><option selected>3:4</option><option>4:3</option><option>2:3</option><option>3:2</option><option>16:9</option><option>9:16</option></select></label><label class="param">生成数量<select id="count"><option value="1">1 张</option><option value="2" selected>2 张</option><option value="3">3 张</option><option value="4">4 张</option></select></label><button class="primary" type="submit">生成 Logo ↗</button></div><p id="brief-error" class="error-text" role="alert" hidden></p></form>
<section class="inspiration" aria-labelledby="inspiration-title"><div class="section-head"><h2 id="inspiration-title">找一点灵感</h2><span>选择案例，带入风格与需求</span></div><div id="inspiration-grid" class="inspiration-grid"></div></section><div class="prototype-tools"><span>所有图片为示意图，生成流程使用模拟数据。</span><button type="button" id="demo-failure">演示生成失败</button></div></section>
<section id="history" class="view" aria-labelledby="history-title" hidden><div class="history-heading"><h1 id="history-title">历史记录</h1><p class="subtitle">继续上一次的品牌想法。</p></div><div id="history-list" class="history-list"></div></section>
<section id="chat" hidden aria-label="Logo 生成对话"><div class="chat-view"><div class="chat-title"><h1>Logo 创作</h1><button class="text-button" onclick="navigate('home')">＋ 新的创作</button></div><div id="messages" aria-live="polite"></div></div><div class="chat-dock"><form class="followup" id="followup-form"><label for="revision" hidden>继续修改需求</label><textarea id="revision" aria-label="继续修改需求" maxlength="1000" placeholder="继续修改，例如：图形再简洁一点，保留山的轮廓…"></textarea><div class="followup-bottom"><span id="followup-hint">沿用本次风格、比例与数量</span><button class="primary" type="submit" id="revise-button">继续生成 ↑</button></div><p id="revision-error" class="error-text" role="alert" hidden></p></form></div></section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="preview" aria-labelledby="preview-title"><div class="preview-header"><strong id="preview-title">Logo 预览</strong><button class="close" aria-label="关闭预览" onclick="closePreview()">×</button></div><div class="preview-main"><button class="switch" id="previous-image" aria-label="上一张" onclick="switchImage(-1)">‹</button><img id="preview-image" alt="Logo 放大预览"><button class="switch" id="next-image" aria-label="下一张" onclick="switchImage(1)">›</button></div><div class="preview-footer"><span id="preview-counter"></span><a id="preview-download" class="download" download>下载这张 Logo</a></div></dialog>
<script>
const $=id=>document.getElementById(id);
const examples=[{style:'极简几何',name:'山间',sub:'SHAN JIAN',brief:'为咖啡品牌「山间」设计 Logo，简约自然，结合山峰与咖啡元素。'},{style:'字母组合',name:'NOVA',sub:'CREATIVE STUDIO',brief:'为创意工作室「NOVA」设计字母组合 Logo，理性、简洁、有秩序感。'},{style:'复古徽章',name:'麦野',sub:'BAKERY & CO.',brief:'为烘焙品牌「麦野」设计复古徽章 Logo，体现手作、温暖和麦穗元素。'},{style:'自然有机',name:'木序',sub:'BOTANICAL LIFE',brief:'为植物生活品牌「木序」设计自然有机 Logo，融入叶片和生长的线条。'},{style:'现代字标',name:'间序',sub:'SPACE DESIGN',brief:'为室内设计品牌「间序」设计现代字标 Logo，克制、通透、强调空间感。'},{style:'趣味图形',name:'豆点',sub:'LITTLE JOY',brief:'为儿童用品品牌「豆点」设计趣味图形 Logo，用简单图形表现好奇心和快乐。'}];
let sessions=[],current=null,busy=false,toastTimer=null,previewImages=[],previewIndex=0,previewTrigger=null;
try{const saved=JSON.parse(localStorage.getItem('logo-wireframe-v1')||'[]');if(Array.isArray(saved))sessions=saved.filter(s=>s&&typeof s.id==='string'&&Array.isArray(s.turns));}catch{}
function save(){try{localStorage.setItem('logo-wireframe-v1',JSON.stringify(sessions));}catch{}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function logo(style,name,index,ratio='1:1'){
 const [rw,rh]=ratio.split(':').map(Number),w=600,h=Math.round(600*rh/rw),cy=h/2-30;let shape='';const shift=index%2?12:0;
 if(style==='极简几何')shape=`<path d="M215 ${cy+25} L300 ${cy-80-shift} L385 ${cy+25} Z" fill="none" stroke="#363636" stroke-width="11"/><path d="M255 ${cy+25} L300 ${cy-28} L345 ${cy+25}" fill="none" stroke="#777" stroke-width="7"/>`;
 if(style==='字母组合')shape=`<path d="M235 ${cy+35}V${cy-75}L365 ${cy+35}V${cy-75}" fill="none" stroke="#333" stroke-width="18"/><path d="M270 ${cy+35}L330 ${cy-75}" stroke="#999" stroke-width="8"/>`;
 if(style==='复古徽章')shape=`<circle cx="300" cy="${cy-10}" r="94" fill="none" stroke="#444" stroke-width="3"/><circle cx="300" cy="${cy-10}" r="83" fill="none" stroke="#888" stroke-width="1"/><path d="M300 ${cy+35}V${cy-55}M300 ${cy}Q250 ${cy-15} 275 ${cy-38}Q305 ${cy-23} 300 ${cy}M300 ${cy-15}Q350 ${cy-30} 325 ${cy-53}Q295 ${cy-38} 300 ${cy-15}" fill="none" stroke="#444" stroke-width="6"/>`;
 if(style==='自然有机')shape=`<path d="M295 ${cy+45}Q210 ${cy-45} 280 ${cy-90}Q345 ${cy-25} 295 ${cy+45}M300 ${cy+45}Q300 ${cy-55} 390 ${cy-45}Q390 ${cy+35} 300 ${cy+45}" fill="none" stroke="#555" stroke-width="8"/><path d="M280 ${cy-65}L320 ${cy+75}" stroke="#777" stroke-width="3"/>`;
 if(style==='现代字标')shape=`<path d="M220 ${cy+25}V${cy-70}H280M320 ${cy-70}H380V${cy+25}M250 ${cy-20}H350M280 ${cy+25}H320" fill="none" stroke="#333" stroke-width="8"/>`;
 if(style==='趣味图形')shape=`<rect x="220" y="${cy-80}" width="160" height="135" rx="60" fill="${index%2?'#444':'#777'}"/><circle cx="270" cy="${cy-25}" r="9" fill="#fafafa"/><circle cx="330" cy="${cy-25}" r="9" fill="#fafafa"/><path d="M275 ${cy+5}Q300 ${cy+30} 325 ${cy+5}" stroke="#fafafa" stroke-width="6" fill="none"/>`;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="${index%2?'#e7e7e7':'#f1f1f1'}"/><g transform="translate(0 ${index%2?8:0})">${shape}<text x="300" y="${cy+140}" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="${name.length>8?28:37}" letter-spacing="7" text-anchor="middle" fill="#333">${esc(name.slice(0,16))}</text><text x="300" y="${cy+174}" font-family="Arial,sans-serif" font-size="11" letter-spacing="5" text-anchor="middle" fill="#888">LOGO CONCEPT ${String(index+1).padStart(2,'0')}</text></g></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
function navigate(page){for(const name of ['home','history','chat'])$(name).hidden=name!==page;$('nav-home').classList.toggle('active',page!=='history');$('nav-history').classList.toggle('active',page==='history');$('nav-home').setAttribute('aria-current',page==='home'?'page':'false');$('nav-history').setAttribute('aria-current',page==='history'?'page':'false');$('page-label').textContent=page==='history'?'历史记录':page==='chat'?'Logo 创作':'开始创作';if(page==='history')renderHistory();window.scrollTo({top:0});}
function renderExamples(){examples.forEach((e,i)=>{const b=document.createElement('button');b.className='inspo';b.innerHTML=`<img src="${logo(e.style,e.name,i,'4:3')}" alt="${esc(e.style+' Logo 灵感示例：'+e.name)}"><div class="inspo-bottom">${e.style}<span>使用这个方向 ↗</span></div>`;b.onclick=()=>{$('brief').value=e.brief;$('style').value=e.style;$('brief-error').hidden=true;$('brief').focus();$('home-form').scrollIntoView({behavior:'smooth',block:'center'});};$('inspiration-grid').append(b);});}
function nameFrom(brief){return (brief.match(/[「“"]([^」”"]+)[」”"]/)?.[1]||brief.match(/(?:品牌|名称)[：: ]+([^，。\s]+)/)?.[1]||brief.slice(0,8)).trim();}
function makeSession(brief){const s={id:'s-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),brief,style:$('style').value,ratio:$('ratio').value,count:Number($('count').value),created:Date.now(),turns:[]};sessions.unshift(s);current=s;return s;}
function start(fail=false){if(busy){toast('当前任务进行中，请稍候');if(current){renderChat();navigate('chat');}return;}const brief=$('brief').value.trim();if(!brief){$('brief-error').textContent='先输入品牌名称、行业或设计需求。';$('brief-error').hidden=false;$('brief').focus();return;}$('brief-error').hidden=true;makeSession(brief);navigate('chat');generate(brief,fail);}
$('home-form').onsubmit=e=>{e.preventDefault();start();};$('demo-failure').onclick=()=>{if(!$('brief').value.trim())$('brief').value='为咖啡品牌「山间」设计一个简约 Logo。';start(true);};
function renderChat(){if(!current)return;$('messages').replaceChildren();for(const [ti,turn]of current.turns.entries()){
 const u=document.createElement('div');u.className='user-turn';u.innerHTML=`<div class="bubble"><p>${esc(turn.prompt)}</p><div class="chips"><span>${esc(current.style)}</span><span>${current.ratio}</span><span>${current.count} 张</span></div></div>`;$('messages').append(u);
 const a=document.createElement('div');a.className='assistant-turn';a.innerHTML='<div class="assistant-label"><span class="brandmark" aria-hidden="true">形</span>形意 Logo <span class="badge">模拟演示</span></div>';
 if(turn.status==='loading'){a.innerHTML+=`<div class="status" role="status"><span class="spinner" aria-hidden="true"></span><div>${esc(turn.stage)}<small>正在探索你的品牌方向…</small></div></div><div class="skeletons" aria-hidden="true" style="--ratio:${current.ratio.replace(':','/')}">${Array.from({length:current.count},()=>'<div class="skeleton"></div>').join('')}</div>`;}
 else if(turn.status==='failed'){const failed=document.createElement('div');failed.className='failed';failed.innerHTML='<strong>这次生成没有完成</strong><p>模拟服务暂时不可用，你的需求已保留。</p>';const retry=document.createElement('button');retry.className='secondary';retry.textContent='重新生成';retry.disabled=busy;retry.onclick=()=>generate(turn.prompt,false,ti);failed.append(retry);a.append(failed);}
 else{const note=document.createElement('p');note.className='completed-note';note.textContent=`已生成 ${turn.images.length} 个 Logo 方向 · 点击图片放大查看`;a.append(note);const wall=document.createElement('div');wall.className='wall';wall.style.setProperty('--ratio',current.ratio.replace(':','/'));turn.images.forEach((src,i)=>{const card=document.createElement('div');card.className='logo-card';const open=document.createElement('button');open.className='logo-open';open.setAttribute('aria-label',`放大查看方案 ${i+1}`);open.innerHTML=`<img src="${src}" alt="Logo 方案 ${i+1}，${esc(current.style)}"><span class="zoom-tag">放大查看</span>`;open.onclick=()=>openPreview(turn.images,i);const meta=document.createElement('div');meta.className='card-meta';meta.innerHTML=`<span>方案 ${String(i+1).padStart(2,'0')}</span><a class="download" href="${src}" download="logo-concept-${i+1}.svg">下载</a>`;card.append(open,meta);wall.append(card);});a.append(wall);}
 $('messages').append(a);
 }$('revise-button').disabled=busy;$('revision').disabled=busy;$('revision').placeholder=busy?'正在生成，完成后可以继续修改…':'继续修改，例如：图形再简洁一点，保留山的轮廓…';$('followup-hint').textContent=`${current.style} · ${current.ratio} · ${current.count} 张`;}
function generate(prompt,fail=false,retryIndex=null){if(busy)return;busy=true;const owner=current;const turn={prompt,status:'loading',stage:'理解品牌需求',images:[]};if(retryIndex===null)owner.turns.push(turn);else owner.turns[retryIndex]=turn;renderChat();const stages=['探索视觉方向','构建 Logo 方案','整理生成结果'];stages.forEach((stage,i)=>setTimeout(()=>{turn.stage=stage;if(current===owner&&!$('chat').hidden)renderChat();},(i+1)*900));setTimeout(()=>{turn.status=fail?'failed':'success';if(!fail){const base=nameFrom(owner.brief);const changed=owner.turns.length>1;turn.images=Array.from({length:owner.count},(_,i)=>logo(owner.style,base,i+(changed?1:0),owner.ratio));}busy=false;save();if(current===owner){renderChat();if(!$('chat').hidden)$('messages').lastElementChild?.scrollIntoView({behavior:'smooth',block:'start'});}if(!$('history').hidden)renderHistory();toast(fail?'生成失败，需求已保留':`生成完成，${owner.count} 个 Logo 方向已就绪`);},3800);}
$('followup-form').onsubmit=e=>{e.preventDefault();if(busy)return;const prompt=$('revision').value.trim();if(!prompt){$('revision-error').textContent='输入你想调整的地方。';$('revision-error').hidden=false;$('revision').focus();return;}$('revision-error').hidden=true;$('revision').value='';generate(prompt);};
function renderHistory(){const list=$('history-list');list.replaceChildren();if(!sessions.length){list.innerHTML='<div class="empty">还没有创作记录<p>从你的第一个品牌想法开始。</p><button class="secondary" onclick="navigate(\'home\')">开始创作</button></div>';return;}sessions.forEach(s=>{const last=s.turns.at(-1),img=[...s.turns].reverse().find(t=>t.images?.length)?.images[0]||logo(s.style,nameFrom(s.brief),0);const b=document.createElement('button');b.className='history-item';b.innerHTML=`<img src="${img}" alt="创作缩略图"><span><strong>${esc(s.brief.slice(0,60))}</strong><small>${s.style} · ${s.ratio} · ${last?.status==='loading'?'生成中':last?.status==='failed'?'未完成':'已完成'} · ${new Date(s.created).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></span><span class="arrow" aria-hidden="true">↗</span>`;b.onclick=()=>{current=s;renderChat();navigate('chat');};list.append(b);});}
function openPreview(images,index){previewImages=images;previewIndex=index;previewTrigger=document.activeElement;updatePreview();$('preview').showModal();$('preview').querySelector('.close').focus();}
function updatePreview(){const src=previewImages[previewIndex];$('preview-image').src=src;$('preview-title').textContent=`方案 ${String(previewIndex+1).padStart(2,'0')}`;$('preview-counter').textContent=`${previewIndex+1} / ${previewImages.length}`;$('preview-download').href=src;$('preview-download').download=`logo-concept-${previewIndex+1}.svg`;$('previous-image').disabled=$('next-image').disabled=previewImages.length<2;}
function switchImage(step){previewIndex=(previewIndex+step+previewImages.length)%previewImages.length;updatePreview();}
function closePreview(){$('preview').close();}
$('preview').addEventListener('close',()=>previewTrigger?.focus());$('preview').addEventListener('click',e=>{if(e.target===$('preview')){const r=$('preview').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePreview();}});document.addEventListener('keydown',e=>{if($('preview').open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchImage(e.key==='ArrowLeft'?-1:1);}});
// Interrupted simulated tasks are recoverable rather than left permanently loading.
for(const s of sessions)for(const t of s.turns)if(t.status==='loading')t.status='failed';
document.addEventListener('click',e=>{const a=e.target.closest('a[download]');if(!a||!a.getAttribute('href')?.startsWith('data:image/svg+xml'))return;e.preventDefault();const svg=decodeURIComponent(a.getAttribute('href').split(',').slice(1).join(','));const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const link=document.createElement('a');link.href=url;link.download=a.download;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);});
renderExamples();navigate('home');
</script>
</body></html>
