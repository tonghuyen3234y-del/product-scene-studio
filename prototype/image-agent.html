<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品场景 Agent · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#292929;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a,label.upload{cursor:pointer}button{border:1px solid #ccc;border-radius:8px;background:#fff;padding:9px 15px}button:hover{background:#eee}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #555;outline-offset:3px}[hidden]{display:none!important}header{height:72px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 36px;background:#fafafa}.identity{display:flex;align-items:center;gap:12px}.mark{border:1px solid #555;border-radius:8px;padding:3px 9px;font-size:18px}.muted{color:#777;font-size:12px}.nav{display:flex;gap:10px}.nav button{font-size:13px;border:0;background:none}.home{max-width:850px;margin:80px auto;padding:0 24px}.hero{display:flex;gap:30px;justify-content:center;align-items:center;margin:0 0 40px}h1{font-size:34px;font-weight:550;letter-spacing:-1px;margin:0 0 9px}.hero p{margin:0;color:#777}.pet{width:85px;height:90px;position:relative;border:2px solid #666;border-radius:35px 35px 26px 26px;background:#eee;transition:transform .2s;flex-shrink:0}.pet:hover{transform:rotate(-7deg) translateY(-4px)}.pet::before{content:'•  •';font-size:30px;position:absolute;top:14px;left:21px;letter-spacing:4px}.pet::after{content:'⌣';font-size:25px;position:absolute;top:40px;left:30px}.pet.nod{transform:rotate(8deg) scale(.95)}.composer{border:1px solid #bbb;border-radius:16px;padding:22px;background:#fff}.composer:focus-within{border-color:#555}.composer textarea{display:block;width:100%;height:125px;resize:vertical;border:0;background:none;font-size:17px;line-height:1.8;padding:0;outline:none}.composer:has(textarea:focus-visible){outline:2px solid #aaa;outline-offset:3px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #eee;padding-top:16px;margin-top:14px}.tools select{border:1px solid #ddd;background:#f4f4f4;border-radius:7px;padding:8px;font-size:12px;max-width:190px}.upload{border:1px solid #bbb;border-radius:7px;padding:7px 12px;display:inline-block;font-size:18px;position:relative}.upload input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}.upload:focus-within{outline:2px solid #555}.primary{white-space:nowrap;background:#333;color:#fff;border-color:#333}.primary:hover{background:#555}.tools .primary{margin-left:auto}.attachment{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:12px}.attachment img{width:62px;height:62px;object-fit:contain;border:1px solid #ccc;filter:grayscale(1);border-radius:7px}.attachment button{padding:4px 9px;font-size:12px}.error{border-left:3px solid #777;background:#eee;padding:12px;font-size:13px;margin:12px 0}.home-note{display:flex;gap:15px;justify-content:center;margin-top:25px;font-size:12px;color:#777}.text-btn{background:none;border:0;padding:0;text-decoration:underline;font-size:12px}.chat-shell{max-width:930px;margin:auto;padding:28px 28px 230px}.chat-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.chat-heading h2{font-size:21px;font-weight:500;margin:0}.turn{margin:0 0 45px;scroll-margin-top:20px}.user{max-width:78%;margin-left:auto;padding:16px 20px;border-radius:12px 12px 0 12px;background:#e6e6e6;overflow-wrap:anywhere}.user p{white-space:pre-wrap;margin:0}.user img{width:70px;height:75px;object-fit:contain;filter:grayscale(1);background:white;border:1px solid #ccc;margin-top:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:#777;font-size:11px}.agent{margin-top:22px}.agent-name{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:13px}.dot{width:24px;height:24px;border:1px solid #888;border-radius:7px;text-align:center}.planning{border:1px dashed #bbb;color:#888;padding:11px 15px;border-radius:8px;font-size:12px;margin:12px 0}.status{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #ccc;border-radius:9px;background:#eee}.spinner{width:15px;height:15px;border:2px solid #bbb;border-top-color:#444;border-radius:50%;animation:spin 1s linear infinite}.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:15px}.skeleton{border:1px dashed #bbb;background:#eee;aspect-ratio:var(--ratio);display:grid;place-items:center;color:#999;font-size:12px}.card{border:1px solid #ccc;background:white;border-radius:9px;overflow:hidden}.open{display:block;width:100%;padding:0;border:0;border-radius:0}.card img{width:100%;display:block;aspect-ratio:var(--ratio);object-fit:contain}.card-footer{display:flex;justify-content:space-between;padding:11px 13px;align-items:center;font-size:12px}.download{font-size:12px;color:#444;text-decoration:none;border:1px solid #ccc;border-radius:5px;padding:4px 10px}.dock{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f7f7f7 15%);padding:20px 24px;z-index:5}.dock .composer{max-width:874px;margin:auto;padding:15px 18px}.dock textarea{height:58px;min-height:58px;font-size:14px}.dock .tools{padding-top:10px;margin-top:10px}.dock .tools span{font-size:12px;color:#777}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:white;border-radius:9px;padding:12px 22px;z-index:100;font-size:13px}.demo-bar{border-top:1px solid #ccc;background:#eee;position:fixed;bottom:0;right:0;z-index:20;font-size:12px;padding:7px 15px;display:flex;gap:10px;align-items:center}.demo-bar select{font-size:12px;max-width:140px}.demo-bar button{padding:3px 10px;font-size:12px}.dock{padding-bottom:65px}dialog{border:1px solid #999;border-radius:12px;padding:0;background:#f4f4f4;width:min(800px,94vw);max-height:94dvh}dialog::backdrop{background:#0009}.preview-head,.preview-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}.preview-head{border-bottom:1px solid #ccc}.preview-head button{border:0;background:none;font-size:22px;padding:0 8px}#preview-image{display:block;max-width:100%;max-height:70dvh;margin:auto;object-fit:contain}.preview-foot{border-top:1px solid #ccc;font-size:12px}.preview-switch{display:flex;gap:10px;align-items:center}.preview-switch button{padding:3px 12px}.failed{padding:20px;background:#eee;border:1px solid #bbb;border-radius:9px}.failed p{font-size:13px;color:#777}.failed button{font-size:13px}.return-note{max-width:850px;margin:18px auto -45px;padding:0 24px;display:flex;justify-content:flex-end}.empty-chat{padding:60px;text-align:center;border:1px dashed #ccc}.phase-done{font-size:12px;color:#777;margin:12px 0}.chat-titlebar{display:flex;gap:12px}.chat-titlebar button{font-size:12px}body:has(dialog[open]){overflow:hidden}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:640px){header{padding:0 18px;height:62px}.identity{gap:8px;font-size:13px}.nav button{padding:6px;font-size:12px}.home{margin-top:42px}.hero{gap:15px;align-items:center;margin-bottom:28px}h1{font-size:25px}.hero p{font-size:13px}.pet{width:65px;height:72px;border-radius:25px}.pet::before{left:13px;top:9px;font-size:26px}.pet::after{left:23px;top:30px;font-size:23px}.composer{padding:17px}.composer textarea{font-size:15px}.tools{gap:8px}.tools select{max-width:150px}.tools .primary{margin-left:0;flex:1}.chat-shell{padding:22px 16px 260px}.user{max-width:90%}.chat-heading h2{font-size:18px}.chat-heading{align-items:flex-start;gap:10px}.chat-titlebar{gap:5px}.wall{gap:10px}.dock{padding:15px 12px 85px}.demo-bar{left:0;flex-wrap:wrap;justify-content:center;font-size:11px;padding:6px}.demo-bar select{max-width:125px}.home-note{flex-wrap:wrap}.return-note{margin-bottom:-25px}.card-footer{padding:9px;gap:5px;font-size:11px}.download{font-size:11px;padding:4px 6px}.toast{top:72px;width:max-content;max-width:90vw}.planning{font-size:11px}.preview-head,.preview-foot{padding:12px}.dock .tools .primary{flex:0 0 auto;margin-left:auto}.chat-titlebar .secondary{padding:6px}.chat-shell .turn{margin-bottom:35px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="identity"><span class="mark" aria-hidden="true">✳</span><strong>商品场景 Agent</strong></div><nav class="nav"><button id="home-nav">首页</button><button id="chat-nav" hidden>当前对话</button></nav></header>
<div id="return-note" class="return-note" hidden><button class="text-btn" id="resume">返回当前对话 ↗</button></div>
<section id="home" class="home"><div class="hero"><button class="pet" id="pet" aria-label="与创作助手打招呼"></button><div><h1>说出想法，让商品进入场景。</h1><p>你的 AI 创作搭档</p></div></div>
<form id="home-form" class="composer"><textarea id="brief" aria-label="创作需求" maxlength="1500" placeholder="想让这件商品出现在什么场景？"></textarea><div id="attachment" class="attachment" hidden><img id="reference-preview" alt="参考图缩略图"><span id="reference-name"></span><button type="button" id="remove-image" aria-label="移除参考图">×</button></div><div id="upload-error" class="error" role="alert" hidden></div><div class="tools"><label class="upload" title="上传参考图"><span aria-hidden="true">＋</span><input id="file" type="file" accept="image/*" aria-label="上传参考图"></label><select id="ratio" aria-label="宽高比"><option>1:1</option><option selected>3:4</option><option>4:3</option><option>2:3</option><option>3:2</option><option>16:9</option><option>9:16</option></select><select id="scene" aria-label="场景类型"><option>两种都要</option><option>纯商品展示场景</option><option>人机交互场景</option></select><select id="count" aria-label="生成数量"><option value="1">1 张</option><option value="2" selected>2 张</option><option value="3">3 张</option><option value="4">4 张</option></select><button class="primary" type="submit" id="start">生成 ↗</button></div><p id="home-error" class="error" role="alert" hidden></p></form><div class="home-note"><button class="text-btn" id="use-example">填入示例需求与参考图</button><span>灰阶原型 · 生成与上传状态均为模拟</span></div></section>
<section id="chat" hidden><div class="chat-shell"><div class="chat-heading"><h2>场景创作对话</h2><div class="chat-titlebar"><button id="back" class="secondary">返回首页</button><button id="new" class="secondary">新建创作</button></div></div><div id="messages"></div></div><div class="dock"><form id="followup-form" class="composer"><textarea id="followup" aria-label="继续修改需求" maxlength="1500" placeholder="继续说说想调整的地方…"></textarea><div class="tools"><span id="context">沿用本次参考图与参数</span><button class="primary" id="send" type="submit">继续生成 ↑</button></div><p id="followup-error" class="error" role="alert" hidden></p></form></div></section>
<div class="demo-bar" aria-label="原型演示工具"><span>原型演示</span><select id="demo-state" aria-label="选择演示状态"><option value="home">首页</option><option value="input">输入就绪</option><option value="loading">生成中</option><option value="complete">生成完成</option><option value="preview">图片预览</option><option value="multi">多轮对话</option><option value="upload-error">上传失败</option><option value="generate-error">生成失败</option></select><button id="show-state">查看状态</button><label><input id="fail-next" type="checkbox">下轮生成失败</label><label><input id="fail-upload" type="checkbox">下次上传失败</label></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="preview" aria-labelledby="preview-title"><div class="preview-head"><strong id="preview-title">图片预览</strong><button id="close-preview" aria-label="关闭预览">×</button></div><img id="preview-image" alt="场景示意图放大预览"><div class="preview-foot"><div class="preview-switch"><button id="prev" aria-label="上一张">‹</button><span id="preview-index"></span><button id="next" aria-label="下一张">›</button></div><a id="preview-download" class="download" download="场景示意图.svg">下载图片</a></div></dialog>
<script>
const $=id=>document.getElementById(id);let reference=null,turns=[],config=null,busy=false,view='home',timers=[],toastTimer,uploadVersion=0,uploading=false,previewList=[],previewIndex=0,previewTrigger;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function svgImage(index=0,round=1,ratio='3:4',ref=false){const [a,b]=ratio.split(':').map(Number),w=600,h=Math.round(w*b/a);return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="600" height="${h}" fill="#eeeeee"/><path d="M0 ${h*.68}H600M400 0V${h*.68}" stroke="#cccccc" stroke-width="2"/><ellipse cx="300" cy="${h*.77}" rx="150" ry="24" fill="#d2d2d2"/><rect x="${index%2?130:100}" y="${h*.65}" width="370" height="${h*.1}" fill="#ddd" stroke="#aaa"/><rect x="${260+index*15}" y="${h*.35}" width="80" height="${h*.3}" rx="10" fill="#fafafa" stroke="#777" stroke-width="3"/><rect x="${273+index*15}" y="${h*.31}" width="54" height="${h*.06}" rx="4" fill="#aaa" stroke="#777"/><path d="M85 ${h*.65}Q15 ${h*.39} 120 ${h*.4}Q160 ${h*.5} 85 ${h*.65}" fill="#ccc" stroke="#aaa"/><text x="300" y="${h*.89}" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#777">${ref?'参考图占位':`第 ${round} 轮 · 场景 ${index+1}`}</text><text x="300" y="${h*.94}" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">WIREFRAME · ${ref?'REFERENCE':'SIMULATED RESULT'}</text></svg>`);}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
function go(page){view=page;$('home').hidden=page!=='home';$('chat').hidden=page!=='chat';$('chat-nav').hidden=!turns.length;$('return-note').hidden=page!=='home'||!turns.length;window.scrollTo(0,0);}
function showReference(){ $('attachment').hidden=!reference;if(reference){$('reference-preview').src=reference.src;$('reference-name').textContent=reference.name;} }
function seed(){reference={src:svgImage(0,1,'3:4',true),name:'示例参考图'};$('brief').value='为这款香水生成自然窗光下的商品场景，背景简洁，保留瓶身细节。';showReference();$('home-error').hidden=true;$('upload-error').hidden=true;}
async function upload(file){if(!file)return;const version=++uploadVersion;uploading=true;$('start').disabled=true;$('upload-error').hidden=true;const previous=reference;reference=null;showReference();notify('正在处理参考图…');try{await new Promise(r=>setTimeout(r,600));if($('fail-upload').checked){$('fail-upload').checked=false;throw new Error('参考图上传失败，请重新选择。');}if(!file.type.startsWith('image/'))throw new Error('请选择图片文件。');const src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('图片读取失败，请重试。'));reader.readAsDataURL(file);});await new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(new Error('图片无法预览，请换一张 JPG 或 PNG。'));img.src=src;});if(version!==uploadVersion)return;reference={src,name:file.name};showReference();notify('参考图已就绪');}catch(e){if(version!==uploadVersion)return;reference=previous;showReference();$('upload-error').replaceChildren();const text=document.createElement('span');text.textContent=e.message+' ';const retry=document.createElement('button');retry.type='button';retry.className='text-btn';retry.textContent='重新上传';retry.onclick=()=>$('file').click();$('upload-error').append(text,retry);$('upload-error').hidden=false;}finally{if(version===uploadVersion){uploading=false;$('start').disabled=busy;$('file').value='';}}}
$('file').onchange=e=>upload(e.target.files[0]);$('remove-image').onclick=()=>{uploadVersion++;reference=null;showReference();};$('use-example').onclick=seed;$('pet').onclick=()=>{$('pet').classList.add('nod');setTimeout(()=>$('pet').classList.remove('nod'),250);};
function currentConfig(){return{ratio:$('ratio').value,scene:$('scene').value,count:Number($('count').value),reference:reference?{...reference}:null};}
function clearRun(){timers.forEach(clearTimeout);timers=[];busy=false;$('send').disabled=false;$('followup').disabled=false;$('start').disabled=false;}
function reset(){clearRun();turns=[];config=null;$('messages').replaceChildren();go('home');}
function render(){const root=$('messages');root.replaceChildren();turns.forEach((turn,i)=>{const section=document.createElement('article');section.className='turn';section.id='turn-'+i;const user=document.createElement('div');user.className='user';const p=document.createElement('p');p.textContent=turn.prompt;user.append(p);if(i===0&&config.reference){const img=document.createElement('img');img.src=config.reference.src;img.alt='本轮上传的参考图';user.append(img);}const chips=document.createElement('div');chips.className='chips';chips.textContent=`${i===0?'':'沿用参考图 · '}${config.ratio} · ${config.scene} · ${config.count} 张`;user.append(chips);const agent=document.createElement('div');agent.className='agent';agent.innerHTML='<div class="agent-name"><span class="dot" aria-hidden="true">✳</span>场景创作助手</div>';
if(turn.status==='loading'){agent.innerHTML+='<div class="planning">Planning / 需求澄清 · 模块预留</div><div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span>'+escapeText(turn.stage)+'</span></div>';const wall=document.createElement('div');wall.className='wall';wall.style.setProperty('--ratio',config.ratio.replace(':','/'));wall.innerHTML=Array.from({length:config.count},()=>'<div class="skeleton">生成结果占位</div>').join('');agent.append(wall);}else if(turn.status==='failed'){const box=document.createElement('div');box.className='failed';box.innerHTML='<strong>本轮生成失败</strong><p>需求、参考图和前几轮结果已保留。</p>';const retry=document.createElement('button');retry.textContent='重试本轮';retry.disabled=busy;retry.onclick=()=>run(turn.prompt,false,i);box.append(retry);agent.append(box);}else{const note=document.createElement('p');note.className='phase-done';note.textContent=`第 ${i+1} 轮 · ${turn.images.length} 张结果`;agent.append(note);const wall=document.createElement('div');wall.className='wall';wall.style.setProperty('--ratio',config.ratio.replace(':','/'));turn.images.forEach((src,j)=>{const card=document.createElement('div');card.className='card';const open=document.createElement('button');open.className='open';open.setAttribute('aria-label',`放大第 ${i+1} 轮第 ${j+1} 张图片`);const img=document.createElement('img');img.src=src;img.alt=`第 ${i+1} 轮场景 ${j+1}，灰阶示意图`;open.append(img);open.onclick=()=>preview(turn.images,j);const foot=document.createElement('div');foot.className='card-footer';foot.innerHTML=`<span>场景 ${j+1}</span><a class="download" href="${src}" download="场景-${i+1}-${j+1}.svg">下载</a>`;card.append(open,foot);wall.append(card);});agent.append(wall);}section.append(user,agent);root.append(section);});$('send').disabled=busy;$('followup').disabled=busy;$('start').disabled=busy||uploading;$('context').textContent=busy?'当前任务生成中':`沿用参考图 · ${config.ratio} · ${config.count} 张`;$('followup').placeholder=busy?'生成完成后，可以继续提出修改需求…':'继续说说想调整的地方…';}
function run(prompt,fail=false,retryIndex=null,hold=false){if(busy)return;busy=true;const index=retryIndex===null?turns.length:retryIndex;const turn={prompt,status:'loading',stage:'任务状态 · 正在生成',images:[]};if(retryIndex===null)turns.push(turn);else turns[index]=turn;render();go('chat');document.getElementById('turn-'+index).scrollIntoView({block:'start',behavior:'smooth'});if(hold)return;timers.push(setTimeout(()=>{turn.stage='任务状态 · 正在准备结果';render();},1800));timers.push(setTimeout(()=>{busy=false;turn.status=fail?'failed':'success';if(!fail)turn.images=Array.from({length:config.count},(_,j)=>svgImage(j,index+1,config.ratio));render();notify(fail?'本轮生成失败，可重试':'生成完成，图片已就绪');},4000));}
$('home-form').onsubmit=e=>{e.preventDefault();if(busy){notify('当前任务还在生成');go('chat');return;}if(uploading)return;const text=$('brief').value.trim();if(!reference){$('home-error').textContent='先上传一张参考图，也可以使用示例。';$('home-error').hidden=false;return;}$('home-error').hidden=true;turns=[];config=currentConfig();const fail=$('fail-next').checked;$('fail-next').checked=false;run(text||'请根据参考图和所选参数生成商品场景图。',fail);};
$('followup-form').onsubmit=e=>{e.preventDefault();if(busy)return;const text=$('followup').value.trim();if(!text){$('followup-error').textContent='输入想修改的地方。';$('followup-error').hidden=false;$('followup').focus();return;}$('followup-error').hidden=true;$('followup').value='';const fail=$('fail-next').checked;$('fail-next').checked=false;run(text,fail);};
$('home-nav').onclick=$('back').onclick=()=>go('home');$('chat-nav').onclick=$('resume').onclick=()=>go('chat');$('new').onclick=()=>{if(busy){notify('当前任务生成中，完成后可新建');return;}reset();$('brief').value='';reference=null;showReference();};
function preview(images,index){previewList=images;previewIndex=index;previewTrigger=document.activeElement;updatePreview();$('preview').showModal();$('close-preview').focus();}function updatePreview(){$('preview-image').src=previewList[previewIndex];$('preview-index').textContent=`${previewIndex+1} / ${previewList.length}`;$('preview-download').href=previewList[previewIndex];$('prev').disabled=$('next').disabled=previewList.length<2;}function switchPreview(n){previewIndex=(previewIndex+n+previewList.length)%previewList.length;updatePreview();}$('prev').onclick=()=>switchPreview(-1);$('next').onclick=()=>switchPreview(1);$('close-preview').onclick=()=>$('preview').close();$('preview').onclose=()=>previewTrigger?.focus();document.addEventListener('keydown',e=>{if($('preview').open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchPreview(e.key==='ArrowLeft'?-1:1);}});
function completed(prompt,round){return{prompt,status:'success',images:Array.from({length:config.count},(_,i)=>svgImage(i,round,config.ratio))};}
$('show-state').onclick=()=>{const state=$('demo-state').value;$('preview').close();clearRun();$('home-error').hidden=$('upload-error').hidden=$('followup-error').hidden=true;$('toast').hidden=true;clearTimeout(toastTimer);if(state==='home'){turns=[];reference=null;$('brief').value='';showReference();go('home');return;}seed();config=currentConfig();turns=[];if(state==='input'){go('home');return;}if(state==='upload-error'){reference=null;showReference();$('upload-error').innerHTML='参考图上传失败，需求已保留。 <button class="text-btn" type="button" id="demo-reupload">重新上传</button>';$('upload-error').hidden=false;go('home');$('demo-reupload').onclick=()=>$('file').click();return;}if(state==='loading'){run($('brief').value,false,null,true);return;}if(state==='generate-error'){turns=[{prompt:$('brief').value,status:'failed',images:[]}];render();go('chat');return;}turns=[completed($('brief').value,1)];if(state==='multi')turns.push(completed('背景再简洁一点，让光线更柔和，保留原商品。',2));render();go('chat');if(state==='preview')preview(turns[0].images,0);else notify('生成完成，图片已就绪');};
// Downloads stay local and never call a model or external API.
document.addEventListener('click',e=>{const a=e.target.closest('a[download]');if(!a)return;e.preventDefault();const raw=decodeURIComponent(a.href.slice(a.href.indexOf(',')+1));const url=URL.createObjectURL(new Blob([raw],{type:'image/svg+xml'}));const link=document.createElement('a');link.href=url;link.download=a.download;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);});go('home');
</script></body></html>
